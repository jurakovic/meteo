<!DOCTYPE html>
<html lang="hr-HR">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<link rel="icon" type="image/png" sizes="16x16" href="/_assets/img/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/_assets/img/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="192x192" href="/_assets/img/android-chrome-192x192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/_assets/img/apple-touch-icon.png">
	<title>Meteo radari</title>
	<!-- seo -->
	<link rel="stylesheet" href="/_assets/css/styles.css">
	<script type="module" src="/_assets/js/landing.js"></script>
	<script src="/_assets/js/include.js" defer></script>
	<!-- gtag -->
</head>
<body>
	<div class="container">
		<div class="progress-container">
			<div class="progress-bar"></div>
		</div>
		<h2>Meteo radari</h2>
		<hr>
		<main class="maps">
			<div class="maps-head">
				<div class="buttons with-help">
					<a href="/customize/index.html"><div class="btn">Prilagodi <span class="beta">beta</span></div></a>
					<div class="links-btn">
						<button type="button" class="btn" data-action="links">Linkovi</button>
						<input type="checkbox" class="links-toggle" data-action="links-bottom" title="Prikaži linkove ispod karata" />
					</div>
					<button type="button" class="btn help-btn" data-action="manual" title="Upute (H)">?</button>
				</div>
			</div>

			<!-- the maps, drawn from the catalog (maps/landing.js) -->
			<div class="maps-list" data-maps></div>

			<div class="maps-foot">
				<div class="maps-links-head" id="links">
					<button type="button" class="expandable">
						<span>Linkovi</span>
						<span class="arrow">▼</span>
					</button>
				</div>
				<div class="links" data-include-html="/_components/links.c.html"></div>
			</div>
		</main>
		<!-- cnt -->
	</div>
	<div class="ms-backdrop" hidden></div>
	<!-- the manual, built in from MANUAL.md; the landing page carries it too,
	     which is why the dialog chrome is the page's (page/dialog.js) -->
	<div class="map-settings manual-dialog" id="manualDialog" data-dialog-key="manualPanel" hidden>
		<div class="ms-head">
			<span class="ms-head-left">
				<a class="ms-home" href="/" title="Početna"><img src="/_assets/img/favicon-32x32.png" alt="Početna"></a>
				<span class="ms-title">Upute</span>
			</span>
			<a class="ms-close" title="Zatvori (Esc)">Zatvori</a>
		</div>
		<div class="ms-body" data-include-html="/_components/manual.c.html">
			<!-- manual -->
		</div>
	</div>
	<footer>
		<a data-action="top">Povratak na vrh</a>
		·
		<span class="manual-link"><a data-action="manual">Upute</a> ·</span>
		<a href="/customize/index.html">Prilagodi <span class="beta">beta</span></a>
		|
		<a href="https://jurakovic.github.io">Projekti</a>
		·
		<a href="https://github.com/jurakovic/meteo">GitHub</a>
	</footer>
</body>
</html>
